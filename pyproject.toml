[project]
name = "legacy-weather-sensor-sdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raksfai", email = "oleksander.veresaka05@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
legacy-weather-sensor-sdk = "legacy_weather_sensor_sdk:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "PT",     # flake8-pytest-style
    "S",      # flake8-bandit
    "ANN",    # flake8-annotations
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["S101"]
"sensor.py" = ["S311"]